services:
  dette:
    image: nginx:alpine
    container_name: dette
    restart: unless-stopped
    ports:
      - "8098:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./model.js:/usr/share/nginx/html/model.js:ro
      - ./sources.js:/usr/share/nginx/html/sources.js:ro
      - ./charts.js:/usr/share/nginx/html/charts.js:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./espagne:/usr/share/nginx/html/espagne:ro
