services:
  dette:
    image: nginx:alpine
    container_name: dette
    restart: unless-stopped
    ports:
      - "8098:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./accueil.js:/usr/share/nginx/html/accueil.js:ro
      - ./i18n.js:/usr/share/nginx/html/i18n.js:ro
      - ./simulateur.js:/usr/share/nginx/html/simulateur.js:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./charts.js:/usr/share/nginx/html/charts.js:ro
      - ./fr:/usr/share/nginx/html/fr:ro
      - ./es:/usr/share/nginx/html/es:ro
