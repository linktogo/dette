server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Toujours revalider : une mise à jour est visible au simple rechargement.
    add_header Cache-Control "no-cache" always;

    # Anciennes adresses de la version espagnole.
    location ~ ^/espagne(/.*)?$ { return 301 /es$1; }
}
